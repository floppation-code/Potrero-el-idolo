<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ídolo de Potrero: El Comienzo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div id="game-container">
    <header>
        <h1>Ídolo de Potrero</h1>
        <div id="location">Casanova, Argentina</div>
    </header>

    <div id="stats-bar">
        <div class="stat-item">Año: <span id="stat-year">2023</span></div>
        <div class="stat-item">Edad: <span id="stat-age">9</span></div>
        <div class="stat-item">Fútbol: <span id="stat-soccer">Malísimo</span></div>
        <div class="stat-item">Plata: <span id="stat-money">$0</span></div>
        <div class="stat-item">Energía: <span id="stat-energy">100%</span></div>
    </div>

    <div id="story-text">
        <!-- Contenido narrativo cargado con JS -->
    </div>

    <div id="choices-container">
        <!-- Opciones dinámicas cargadas con JS -->
    </div>
</div>

<script src="juego.js"></script>
</body>
</html>
