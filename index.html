<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potrero El Ídolo - Juego</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- BARRA SUPERIOR DE ESTADÍSTICAS -->
        <div class="stats-bar">
            <div>📅 <span id="stat-year">2023</span> (<span id="stat-age">9</span> años)</div>
            <div>⚡ <span id="stat-soccer">40 OVR</span></div>
            <div>💵 <span id="stat-money">$300</span></div>
            <div>🔋 <span id="stat-energy">100%</span></div>
        </div>

        <!-- UBICACIÓN ACTUAL -->
        <div id="location" style="font-size: 0.85em; color: #aaa; margin-bottom: 10px; font-weight: bold;">
            Casanova (Barrio)
        </div>

        <!-- TEXTO DE LA HISTORIA -->
        <div id="story-text">
            Cargando juego...
        </div>

        <!-- CONTENEDOR DE OPCIONES Y BOTONES -->
        <div id="choices-container">
            <!-- Los botones se generan dinámicamente desde juego.js -->
        </div>
    </div>

    <!-- ENLACE AL ARCHIVO JUEGO.JS -->
    <script src="juego.js"></script>
</body>
</html>
